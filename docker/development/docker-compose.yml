services:
  php:
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../../.env
    volumes:
      - ../../:/app
    networks:
      - skatepark-network
    depends_on:
      - redis
      - postgres
    links:
      - redis
      - postgres
    ports:
      - "80:8000"
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:latest
    restart: unless-stopped
    working_dir: /app/database
    networks:
      - skatepark-network
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - TZ=GMT+3
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres

  redis:
    image: redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - skatepark-network

volumes:
  postgres-data:

networks:
  skatepark-network:
    driver: bridge
    external: true
    name: skatepark-network
